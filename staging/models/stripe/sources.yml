version: 2

sources:
  - name: stripe
    database: ANALYTICS_DB
    schema: PUBLIC
    tables:
      - name: PAYMENT          # singular, matches Snowflake
        description: "Stripe payment transactions"
        loaded_at_field: CREATED
        config:
          freshness:
            warn_after:
              count: 1
              period: day
            error_after:
              count: 2
              period: day
        columns:
          - name: ORDERID
            description: "Unique order ID"
          - name: AMOUNT
            description: "Payment amount"
          - name: STATUS
            description: "Payment status"
          - name: PAYMENTMETHOD
            description: "Method of payment"
          - name: CREATED
            description: "Date of payment creation"